[project]
name = "hascore"
version = "0.1.0"
description = "AWS HA compliance scorer: multi-AZ and cross-region scoring per account"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "jinja2>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Without this the Jinja template is left out of the wheel and rendering the
# HTML report raises TemplateNotFound in any installed copy.
[tool.setuptools.package-data]
hascore = ["report/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]

# boto3 ships no type stubs; its clients are intentionally Any at our boundary.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.11", "ruff>=0.6"]
