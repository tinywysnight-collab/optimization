[project]
name = "assessment"
version = "0.1.0"
description = "AWS account assessments; the resilience KPI scores multi-AZ and cross-region per account"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "jinja2>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Without this the Jinja template is left out of the wheel and rendering the
# HTML report raises TemplateNotFound in any installed copy.
[tool.setuptools.package-data]
"assessment.resilience" = ["report/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts src/ on sys.path for the test run, so `pytest` works in a checkout that has
# only the dependencies installed — no editable install and no PYTHONPATH to set.
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]

# boto3 ships no type stubs; its clients are intentionally Any at our boundary.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.11", "ruff>=0.6"]
